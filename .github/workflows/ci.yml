name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ --ignore=tests/test_ui_playwright.py -v

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run Playwright UI tests
        env:
          GITHUB_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
        run: pytest tests/test_ui_playwright.py -v -k "chromium"
